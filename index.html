<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الطيار | تسجيل الدخول</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=El+Messiri:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fd5003">
<link rel="stylesheet" href="css/style.css?v=1786904734">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="login-wrap" id="loginScreen">
  <div class="login-orb o1"></div>
  <div class="login-orb o2"></div>
  <div class="login-card">
    <div class="login-logo">🏍️</div>
    <h1>حسابات الطيار</h1>
    <p>سجّل دخولك عشان تكمل</p>

    <form id="loginForm">
      <input type="text" id="username" autocomplete="username" placeholder="الإيميل أو رقم التليفون" required>
      <input type="password" id="password" autocomplete="current-password" placeholder="كلمة السر" required>
      <button type="submit" class="btn-primary-full" id="loginBtn">
        <span id="loginBtnText">دخول</span>
      </button>
      <div class="login-error" id="errorText"></div>
    </form>
  </div>
</div>

<script src="js/supabaseClient.js?v=1786904734"></script>
<script src="js/auth.js?v=1786904734"></script>
<script>
(async function () {
  // لو فيه جلسة شغالة أصلاً، حوّل على الصفحة الصح على طول
  const profile = await getCurrentProfile();
  if (profile) {
    window.location.href = profile.role === "admin" ? "admin.html" : "driver.html";
  }
})();

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;
  const btn = document.getElementById("loginBtn");
  const btnText = document.getElementById("loginBtnText");
  const errorText = document.getElementById("errorText");
  errorText.textContent = "";
  btn.disabled = true;
  btnText.innerHTML = '<span class="dots-loader"><span></span><span></span><span></span><span></span></span>';

  try {
    await loginUser(username, password);
    const profile = await getCurrentProfile();
    if (!profile) {
      errorText.textContent = "الحساب ده مش متفعّل بشكل صحيح، كلّم الأدمن.";
      btn.disabled = false;
      btnText.textContent = "دخول";
      return;
    }
    window.location.href = profile.role === "admin" ? "admin.html" : "driver.html";
  } catch (err) {
    errorText.textContent = (err && err.message === "مفيش حساب مسجل بالرقم ده") ? err.message : "اسم المستخدم أو كلمة السر غلط";
    btn.disabled = false;
    btnText.textContent = "دخول";
  }
});
</script>
<script src="js/pwa.js"></script>
</body>
</html>
