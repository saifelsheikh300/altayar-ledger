<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابي | الطيار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=El+Messiri:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fd5003">
<link rel="stylesheet" href="css/style.css?v=1785609733">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> حسابي</div>
    <button class="icon-btn" id="logoutBtn" title="خروج">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div id="notifyBanner" style="display:none; margin-bottom:14px; background: linear-gradient(135deg, var(--brand), #c73f00); border-radius:14px; padding:14px 16px; font-size:13.5px; font-weight:700; color:#fff; animation: rise .4s ease both;">
  </div>

  <!-- بطاقة الرصيد -->
  <div class="ticket" id="ticket">
    <div class="ticket-label" id="driverName">...</div>
    <div class="ticket-name font-display">رصيدك الحالي</div>
    <div class="balance-row">
      <span class="balance-amount amount zero" id="balanceAmount">0</span>
      <span class="balance-unit">جنيه</span>
    </div>
    <div class="balance-status zero" id="balanceStatus">جاري التحميل...</div>
    <div class="perforation"></div>
    <div class="ticket-footer">
      <span id="txCount">— عملية</span>
      <span id="lastUpdate">—</span>
    </div>
  </div>

  <div id="pendingBanner" style="display:none; margin-top:14px; background: var(--surface-2); border:1px solid var(--brand); border-radius:14px; padding:14px; font-size:13.5px; color: var(--text-dim); display:flex; align-items:center; justify-content:space-between; gap:10px;">
    <span>⏳ طلب تسوية بمبلغ <b class="mono" id="pendingAmount" style="color:var(--text)"></b> ج قيد مراجعة الأدمن</span>
  </div>

  <button class="btn btn-ghost" id="printStatementBtn" style="margin-top:14px;">🖨️ طباعة / مشاركة كشف حسابي</button>

  <!-- سجل الحركات -->
  <div class="section-title">
    <span>سجل الحركات</span>
  </div>
  <div class="timeline" id="timeline">
    <div class="skel" style="height:60px; margin-bottom:12px;"></div>
    <div class="skel" style="height:60px; margin-bottom:12px;"></div>
    <div class="skel" style="height:60px;"></div>
  </div>
</div>

<div class="fab">
  <button class="btn btn-brand" id="requestSettleBtn">📮 طلب تسوية</button>
</div>

<!-- شيت طلب التسوية -->
<div class="sheet-backdrop" id="sheetBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>طلب تسوية حساب</h3>
    <p style="color:var(--text-dim); font-size:13.5px; margin-top:-8px;">هيتبعت طلب للأدمن يراجعه ويوافق عليه</p>
    <div class="field">
      <label>المبلغ (جنيه)</label>
      <input type="number" id="settleAmount" step="0.01" min="0">
    </div>
    <div class="field">
      <label>ملاحظة (اختياري)</label>
      <textarea id="settleNote" placeholder="مثلاً: حولت الفلوس فودافون كاش"></textarea>
    </div>
    <button class="btn btn-brand" id="submitSettleBtn">إرسال الطلب</button>
    <button class="btn btn-ghost" id="cancelSettleBtn" style="margin-top:10px;">إلغاء</button>
  </div>
</div>

<script src="js/supabaseClient.js?v=1785609733"></script>
<script src="js/auth.js?v=1785609733"></script>
<script src="js/driver.js?v=1785609733"></script>
<script src="js/pwa.js"></script>
</body>
</html>
