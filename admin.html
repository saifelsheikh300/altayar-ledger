<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>لوحة الأدمن | الطيار</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=El+Messiri:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#fd5003">
<link rel="stylesheet" href="css/style.css?v=1785609733">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  .tabs { display:flex; gap:6px; background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:5px; margin-bottom:18px; }
  .tab { flex:1; text-align:center; padding:10px; border-radius:10px; font-size:13.5px; font-weight:700; color:var(--text-dim); cursor:pointer; transition:all .2s ease; position:relative;}
  .tab.active { background:var(--brand); color:#fff; }
  .tab .badge-dot { position:absolute; top:2px; left:8px; width:8px; height:8px; border-radius:50%; background:var(--brand); }
  .tab.active .badge-dot { background:#fff; }
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:20px; }
  .stat-card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:14px; }
  .stat-card .lbl { color:var(--text-faint); font-size:12px; }
  .stat-card .val { font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:700; margin-top:4px; }
  .panel { display:none; }
  .panel.active { display:block; animation: rise .35s ease both; }
  .type-chip { display:inline-flex; align-items:center; gap:6px; background:var(--surface-2); border:1px solid var(--border); padding:6px 12px; border-radius:999px; font-size:12.5px; margin:0 6px 8px 0; }
</style>
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> لوحة الأدمن</div>
    <button class="icon-btn" id="logoutBtn" title="خروج">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="lbl">إجمالي عليهم (ديون المناديب)</div>
      <div class="val amount" id="statDebit" style="color:var(--debit)">0</div>
    </div>
    <div class="stat-card">
      <div class="lbl">إجمالي ليهم (مستحقات)</div>
      <div class="val amount" id="statCredit" style="color:var(--credit)">0</div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="drivers">المناديب</div>
    <div class="tab" data-tab="requests">طلبات التسوية <span class="badge-dot" id="reqDot" style="display:none"></span></div>
    <div class="tab" data-tab="settings">الإعدادات</div>
  </div>

  <!-- تاب المناديب -->
  <div class="panel active" id="panel-drivers">
    <div class="field" style="margin-bottom:14px;">
      <input type="text" id="driverSearch" placeholder="🔍 دوّر باسم المندوب أو رقمه...">
    </div>
    <div id="driversList">
      <div class="skel" style="height:70px; margin-bottom:10px;"></div>
      <div class="skel" style="height:70px;"></div>
    </div>
  </div>

  <!-- تاب طلبات التسوية -->
  <div class="panel" id="panel-requests">
    <div id="requestsList">
      <div class="empty-state"><div class="emoji">📭</div>مفيش طلبات تسوية دلوقتي</div>
    </div>
  </div>

  <!-- تاب الإعدادات -->
  <div class="panel" id="panel-settings">
    <div class="section-title" style="margin-top:0;"><span>أنواع العمليات</span></div>
    <div id="typesList" style="margin-bottom:14px;"></div>
    <div style="display:flex; gap:8px; margin-top:10px;">
      <input type="text" id="newTypeName" placeholder="اسم نوع جديد" style="flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:12px; padding:12px 14px; font-family:'Cairo',sans-serif;">
      <button class="btn btn-brand btn-sm" id="addTypeBtn">إضافة</button>
    </div>

    <div class="section-title"><span>إضافة مندوب جديد</span></div>
    <div class="field">
      <label>اسم المندوب</label>
      <input type="text" id="newDriverName">
    </div>
    <div class="field">
      <label>الإيميل</label>
      <input type="email" id="newDriverEmail" placeholder="mohamed@altayar-ledger.local">
    </div>
    <div class="field">
      <label>كلمة السر (6 حروف/أرقام على الأقل)</label>
      <input type="text" id="newDriverPassword">
    </div>
    <div class="field">
      <label>رقم التليفون (اختياري)</label>
      <input type="text" id="newDriverPhone">
    </div>
    <button class="btn btn-brand" id="addDriverBtn">إضافة المندوب</button>

    <div class="section-title"><span>إدارة المناديب</span></div>
    <div id="manageDriversList" style="color:var(--text-faint); font-size:13px;">لسه مفيش مناديب</div>
  </div>
</div>

<!-- شيت تفاصيل المندوب -->
<div class="sheet-backdrop" id="driverSheetBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="driverSheetName">—</h3>
    <div class="balance-row" style="margin-bottom:14px;">
      <span class="balance-amount amount zero" id="driverSheetBalance" style="font-size:32px;">0</span>
      <span class="balance-unit">جنيه</span>
    </div>
    <button class="btn btn-brand" id="addTxBtn">+ إضافة عملية</button>
    <button class="btn btn-ghost" id="printStatementBtn" style="margin-top:10px;">🖨️ طباعة / مشاركة الكشف</button>

    <div class="section-title"><span>اتجاه آخر 14 يوم</span></div>
    <div id="driverTrendChart" style="display:flex; align-items:flex-end; gap:4px; height:70px; padding:0 2px;"></div>
    <div class="section-title"><span>آخر الحركات</span></div>
    <div class="timeline" id="driverSheetTimeline"></div>
  </div>
</div>

<!-- شيت إضافة عملية -->
<div class="sheet-backdrop" id="txSheetBackdrop">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3 id="txSheetTitle">إضافة عملية</h3>
    <div class="field">
      <label>الاتجاه</label>
      <div class="segmented">
        <div class="seg debit active" data-dir="debit">عليه (مديون)</div>
        <div class="seg credit" data-dir="credit">له (دائن)</div>
      </div>
    </div>
    <div class="field">
      <label>النوع</label>
      <select id="txType"></select>
    </div>
    <div class="field">
      <label>المبلغ (جنيه)</label>
      <input type="number" id="txAmount" step="0.01" min="0">
    </div>
    <div class="field">
      <label>ملاحظة (اختياري)</label>
      <textarea id="txNote"></textarea>
    </div>
    <button class="btn btn-brand" id="submitTxBtn">حفظ العملية</button>
    <button class="btn btn-debit" id="deleteTxBtn" style="display:none; margin-top:10px;">حذف العملية</button>
    <button class="btn btn-ghost" id="cancelTxBtn" style="margin-top:10px;">إلغاء</button>
  </div>
</div>

<script src="js/supabaseClient.js?v=1785609733"></script>
<script src="js/auth.js?v=1785609733"></script>
<script src="js/admin.js?v=1785609733"></script>
<script src="js/pwa.js"></script>
</body>
</html>
